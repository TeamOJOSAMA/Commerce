spring:
  application:
    name: commerce

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-base64-secret-key-for-dev-only}
  expiration: 3600000   # 1시간(ms), 필요에 맞게 조정

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

---
# SPRING_PROFILES_ACTIVE=prod 로 실행하면 이 블록이 위 기본값을 덮어씀 (코드 수정 없이 환경변수만으로 전환)
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn