spring.datasource.url=jdbc:h2:mem:commerce-test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
jwt.secret=commerce-test-only-secret-key-for-hmac-sha256
jwt.expiration=3600000
# 캐시는 Redis 대신 인메모리(ConcurrentMap)를 쓴다.
# @Cacheable 프록시가 캐시를 타는지는 검증되지만, Redis 직렬화(Jackson)는 검증되지 않는다.
# 이 프로파일은 외부 MySQL·Redis 없이 돌아야 하므로 Redis 연결을 요구하지 않는다.
spring.cache.type=simple
