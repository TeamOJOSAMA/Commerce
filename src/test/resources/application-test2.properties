spring.datasource.url=jdbc:mysql://localhost:3306/commerce_locktest?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
jwt.secret=commerce-test-only-secret-key-for-hmac-sha256
jwt.expiration=360000
# 테스트는 Redis 논리 DB 1번을 쓴다. 앱(0번)이 넣어 둔 캐시 키가 테스트 결과에 섞이지 않게 분리한다.
spring.data.redis.database=1
